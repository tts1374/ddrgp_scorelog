name: Build master database

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

jobs:
  build-master-db:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev

      - name: Run master parser fixture tests
        run: uv run pytest tests/test_master_builder.py

      - name: Build SQLite master database
        run: uv run python -m master --output data/master/ddrgp-master.sqlite

      - name: Inspect generated database
        run: >
          uv run python -m master.inspect data/master/ddrgp-master.sqlite
          --summary data/master/master-summary.json

      - name: Upload master database artifact
        uses: actions/upload-artifact@v7
        with:
          name: ddrgp-master-${{ github.run_number }}
          path: |
            data/master/ddrgp-master.sqlite
            data/master/master-summary.json
          if-no-files-found: error
          retention-days: 30
