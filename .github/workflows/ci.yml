name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check Python lock file
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev --extra vision

      - name: Ruff
        run: uv run ruff check tools/vision_poc pyproject.toml tests

      - name: Compile Python modules
        run: uv run python -m compileall master tools/vision_poc

      - name: Test
        run: uv run pytest tests

  windows-app:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            app/src/DDRGpScoreViewer/packages.lock.json
            app/tests/DDRGpScoreViewer.Tests/packages.lock.json

      - name: Verify app formatting
        run: dotnet format whitespace app --folder --verify-no-changes

      - name: Restore
        run: dotnet restore app\tests\DDRGpScoreViewer.Tests\DDRGpScoreViewer.Tests.csproj --locked-mode

      - name: Test Debug
        run: >
          dotnet test app\tests\DDRGpScoreViewer.Tests\DDRGpScoreViewer.Tests.csproj
          --configuration Debug
          --no-restore
          --logger "trx;LogFileName=windows-app.trx"
          --results-directory logs\test-results

      - name: Upload Windows test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-app-test-results
          path: logs/test-results/windows-app.trx
          if-no-files-found: warn
          retention-days: 7

      - name: Build Release app
        run: dotnet build app\src\DDRGpScoreViewer\DDRGpScoreViewer.csproj --configuration Release --no-restore

      - name: Verify Release excludes developer operations
        shell: pwsh
        run: .\app\tests\VerifyReleaseBuild.ps1

      - name: Verify Release runtime package boundary
        shell: pwsh
        run: .\app\tests\VerifyReleaseRuntime.ps1

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed-file whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff --check HEAD^
          fi

      - name: Reject tracked local data
        shell: bash
        run: |
          if git ls-files | grep -Ei '^(data|logs|failed-captures)/|^samples/screenshots/metadata\.csv$|^samples/screenshots/.*\.(png|jpe?g|bmp|webp)$|\.(sqlite3?|db)$'; then
            echo "Local data, screenshots, or databases must not be tracked."
            exit 1
          fi
