function progress(rows){if(!['level','version'].includes(state.mode))return '';let vals=[rows.length,rows.filter(r=>r.played).length,rows.filter(r=>!r.played).length,rows.filter(r=>r.played&&r.clear).length,rows.filter(r=>['GFC','PFC','FC'].includes(r.clear)).length,rows.filter(r=>r.played&&r.score>=990000).length];return '<section class="progress-summary"><h3>'+(state.mode==='level'?'Lv.'+state.level:state.version)+'</h3>'+['total','recorded','unrecorded','clearCount','fcCount','aaaCount'].map((k,i)=>'<div><span>'+t(k)+'</span><strong class="num">'+vals[i]+'</strong></div>').join('')+'</section>';}
function table(rows){let goal=state.mode==='goal',side=state.layout==='sidebar'&&state.width>1100;let fixed=goal?[86,112,90,60,70,72,72,105]:[112,120,70,82,82,82,112];if(side)fixed=goal?[76,100,80,52,58,62,62,88]:[94,112,60,68,68,68,94];let widths='<col><col style="width:'+fixed[0]+'px"><col style="width:'+fixed[1]+'px">'+(goal?'<col style="width:'+fixed[2]+'px">':'')+fixed.slice(goal?3:2).map(n=>'<col style="width:'+n+'px">').join('');return '<table class="best-table"><colgroup>'+widths+'</colgroup><thead><tr>'+[t('song'),t('chart'),'BEST / EX',...(goal?[t('remaining')]:[]),'RANK','CLEAR','FLARE',t('playCount'),t('last')].map(v=>'<th>'+v+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr data-chart="'+r.id+'" tabindex="0" aria-label="'+esc(r.song+' '+r.style+' '+r.difficulty+' Lv.'+r.level)+'"><td class="song-title" title="'+esc(r.song)+'">'+esc(r.song)+'</td><td>'+diff(r)+'<span class="chart-level">'+r.style+' · Lv.'+r.level+'</span></td><td class="table-score num"><strong>'+fmt(r.score)+'</strong><small>EX '+fmt(r.played?r.ex+12:null)+'</small></td>'+(goal?'<td class="goal-distance num">'+fmt(r.remaining)+'<small>'+state.goal+'</small></td>':'')+'<td>'+badge(r.played?rank(r.score):null)+'</td><td>'+badge(r.clear,r.clear==='GFC'?'gfc':r.clear==='PFC'?'':'clear')+'</td><td>'+badge(r.flare)+'</td><td class="num">'+(r.played?'3':'0')+'</td><td title="'+(r.played?'2026/10/18 14:26:12':'')+'">'+(r.played?'10/18 14:26':'—')+'</td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="no-records">'+t('empty')+'</div>');}
function resultArea(rows){let sortText=state.language==='ja'?['スコアが高い順','スコアが低い順','曲名順','レベルが低い順','最近プレーした順','プレー回数が多い順']:state.language==='ko'?['점수 높은 순','점수 낮은 순','곡명순','레벨순','최근 플레이순','플레이 횟수순']:['Score, high to low','Score, low to high','Song title','Level','Latest play','Play count'];return '<section class="result-area"><div class="list-actions">'+(['level','version'].includes(state.mode)?'':'<strong>'+rows.length+' '+t('charts')+'</strong>')+''+(state.mode==='goal'?'':'<label class="sort-label" style="margin-left:auto">'+t('sort')+' <select id="sort">'+['score-desc','score-asc','title','level','latest','count'].map((v,i)=>'<option value="'+v+'" '+(state.sort===v?'selected':'')+'>'+sortText[i]+'</option>').join('')+'</select></label>')+'</div><div class="best-list">'+table(rows)+'</div></section>';}
function plays(r){if(!r.played)return [];return [{score:r.score-1810,ex:r.ex-9,at:'2026/10/18 14:26:12',clear:'CLEAR',newBest:false,delta:-1810,exDelta:-21},{score:r.score,ex:r.ex,at:'2026/10/17 22:36:20',clear:r.clear,newBest:true,delta:1330,exDelta:-12},{score:r.score-1330,ex:r.ex+12,at:'2026/10/15 21:10:32',clear:'CLEAR',newBest:true,delta:null,exDelta:null}];}
function graph(r){let p=plays(r).slice().reverse();if(state.graph==='best')p=p.filter(v=>v.newBest);if(!p.length)return '<div class="no-records">'+t('none')+'</div>';let max=r.score+800,min=r.score-2800,y=n=>120-(n-min)/(max-min)*90,x=i=>p.length===1?360:72+i*600/(p.length-1);return '<svg class="score-graph" viewBox="0 0 720 150" role="img" aria-label="'+t('graph')+'">'+[0,1,2].map(i=>{let v=min+i*(max-min)/2;return '<line class="gridline" x1="62" x2="700" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="4" y="'+(y(v)+4)+'">'+fmt(Math.round(v))+'</text>';}).join('')+'<polyline class="line" points="'+p.map((v,i)=>x(i)+','+y(v.score)).join(' ')+'"/>'+p.map((v,i)=>'<circle class="'+(v.newBest?'best-dot':'normal-dot')+'" cx="'+x(i)+'" cy="'+y(v.score)+'" r="4"><title>'+v.at+' · '+fmt(v.score)+'</title></circle><text x="'+x(i)+'" y="143" text-anchor="middle">'+v.at.slice(5,10)+'</text>').join('')+'</svg>';}
function detail(r){let p=plays(r),latest=p[0];return '<div class="detail-view"><section class="detail-summary"><div><div class="detail-identity">'+diff(r)+'<span>'+r.style+' / Lv.'+r.level+'</span></div><span class="caption">'+t('scoreBest')+'</span><div class="best-value num">'+fmt(r.score)+'</div><div class="updated">'+t('updated')+' '+(r.played?'2026/10/17 22:36:20':'—')+'</div><div class="detail-badges">'+badges(r)+'</div></div><div style="padding-top:36px"><span class="caption">'+t('exBest')+'</span><div class="best-ex-value num">'+fmt(r.played?r.ex+12:null)+'</div><div class="updated">'+t('updated')+' '+(r.played?'2026/10/15 21:10:32':'—')+'</div></div><div class="detail-statistics"><div><span class="caption">'+t('playCount')+'</span><strong class="num">'+p.length+'</strong></div><div><span class="caption">'+t('fullcombos')+'</span><strong class="num">'+(r.played&&['GFC','PFC','FC'].includes(r.clear)?1:0)+'</strong></div></div></section><div class="detail-middle"><section class="graph-section"><div class="graph-heading"><h3>'+t('graph')+'</h3><div class="graph-modes"><button data-graph="all" aria-pressed="'+(state.graph==='all')+'">'+t('all')+'</button><button data-graph="best" aria-pressed="'+(state.graph==='best')+'">'+t('bestProgress')+'</button></div></div><div class="caption">'+t('graphNote')+'</div>'+graph(r)+'<div class="graph-legend"><span>'+t('legend').split('　')[0]+'</span>　<span class="best-key">'+t('legend').split('　')[1]+'</span></div></section><section class="latest-chart-play"><h3>'+t('latest')+'</h3><span class="updated">'+(latest?latest.at:'—')+'</span><div class="latest-value num">'+fmt(latest?.score)+'</div><div class="latest-ex">EX SCORE <strong class="num">'+fmt(latest?.ex)+'</strong></div><div class="detail-badges">'+(latest?badge(rank(latest.score))+badge(latest.clear,'clear')+badge('FLARE '+r.flare):'')+'</div><div class="latest-delta"><span>'+t('scoreDelta')+'</span><strong class="num">'+(latest?'−1,810':'—')+'</strong><span>'+t('exDelta')+'</span><strong class="num">'+(latest?'−21':'—')+'</strong></div></section></div><section class="chart-history"><h3>'+t('chartHistory')+'</h3><span class="caption">'+(state.language==='ja'?'プレー'+p.length+'回':p.length+' '+t('all'))+'</span>'+(p.length?'<table class="best-table"><thead><tr>'+[t('played'),'SCORE','EX SCORE','RANK','CLEAR','FLARE',t('scoreDiff'),t('exDiff')].map(v=>'<th>'+v+'</th>').join('')+'</tr></thead><tbody>'+p.map(v=>'<tr><td title="'+v.at+'">'+v.at+'</td><td class="num">'+fmt(v.score)+'</td><td class="num">'+fmt(v.ex)+'</td><td>'+badge(rank(v.score))+'</td><td>'+badge(v.clear,v.clear==='GFC'?'gfc':v.clear==='PFC'?'':'clear')+'</td><td>'+badge('FLARE '+r.flare)+'</td><td class="num" title="'+(state.language==='ja'?'プレー前の自己ベストとの差':state.language==='en'?'Difference from the personal best before this play':'플레이 전 개인 최고 기록과의 차이')+'">'+(v.delta==null?t('initial'):(v.delta>0?'+':'')+fmt(v.delta))+'</td><td class="num" title="'+(state.language==='ja'?'プレー前の自己ベストとの差':state.language==='en'?'Difference from the personal best before this play':'플레이 전 개인 최고 기록과의 차이')+'">'+(v.exDelta==null?t('initial'):fmt(v.exDelta))+'</td></tr>').join('')+'</tbody></table>':'<p class="no-records">'+t('none')+'</p>')+'</section></div>';}

// 画面で使う日本語（内部の識別子は維持）
Object.assign(words.en,{history:'Play history',data:'Manage records',scoreBest:'Best score',exBest:'Best EX SCORE',graph:'Score history',bestProgress:'Best updates only',graphNote:'Graph: last 100 plays',scoreDelta:'Change from best before this play (score)',exDelta:'Change from best before this play (EX)',queryNote:'',listHint:'',allShown:''});
Object.assign(words.ko,{history:'플레이 기록',data:'기록 관리',scoreBest:'스코어 최고 기록',exBest:'EX SCORE 최고 기록',graph:'스코어 변화',bestProgress:'최고 기록 갱신만',graphNote:'그래프: 최근 100회 플레이',scoreDelta:'플레이 전 최고 기록과의 차이 (스코어)',exDelta:'플레이 전 최고 기록과의 차이 (EX)',queryNote:'',listHint:'',allShown:''});
Object.assign(words.ja,{"history":"プレー履歴","data":"記録の管理","monitor":"ゲーム待機中","queryNote":"","goalNote":"記録のある未達成の譜面を、目標に近い順に表示","scoreBest":"スコアの自己ベスト","exBest":"EX SCOREの自己ベスト","graph":"スコアの変化","bestProgress":"更新したプレーだけ","graphNote":"グラフは直近100回分","scoreDelta":"プレー前の自己ベストとの差（スコア）","exDelta":"プレー前の自己ベストとの差（EX）","allShown":"","listHint":""});
function render(){let app=document.getElementById('best-window'),rows=filtered(),r=data().find(v=>v.id===state.selected);app.className='app best-app layout-'+state.layout+(state.layout==='top-direct'?' layout-top':'')+(state.width<=1100?' narrow':'')+(state.theme==='dark'?' dark':'');app.style.width=state.width+'px';app.style.height=state.height+'px';document.documentElement.lang=state.language;document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===state.layout)));for(let k of ['theme','fixture','language'])document.getElementById(k).value=state[k];document.getElementById('size').value=String(state.width);document.getElementById('direction').textContent=state.page==='detail'?'譜面詳細：曲・譜面と2種類の自己ベストを先に確認。通常スコアBESTとEX BESTの更新日時は別々に表示し、推移・最新プレー・履歴へ続きます。':'B：候補を左へ並べ、1クリックで切り替えます。一覧の高さを保ち、曲名の横幅を使います。小窓では上部の選択欄へ切り替わります。';app.innerHTML='<div class="chrome"><svg class="app-mark" viewBox="0 0 16 16"><path d="M2 12h3V8h3V4h3V1l4 4h-3v8H2z"/></svg>GP Score Log<div class="window-actions"><span>−</span><span>□</span><span>×</span></div></div><nav class="nav"><span class="brand">GP Score Log</span><div class="nav-group">'+['home','best','history','flare'].map(k=>'<button data-nav="'+k+'" class="'+(k==='best'?'active':'')+'">'+t(k)+'</button>').join('')+'</div><div class="nav-group utility">'+['settings','data'].map(k=>'<button data-nav="'+k+'">'+t(k)+'</button>').join('')+'</div></nav><div class="monitor"><span class="state">'+t('monitor')+'</span><span>'+t('reason')+'</span></div><div class="viewport"><main class="workspace"><div class="page-head"><h2>'+(state.page==='detail'?esc(r.song):t('best'))+'</h2>'+(state.page==='detail'?'<button class="text-link" data-back>'+t('back')+'</button>':'')+'</div>'+(state.page==='list'?'<div class="best-body">'+controls()+progress(rows)+resultArea(rows)+'</div>':detail(r))+'</main></div>';if(state.page==='list')document.querySelector('.best-list').scrollTop=state.listScroll;}
function openChart(id){state.listScroll=document.querySelector('.best-list').scrollTop;state.selected=id;state.page='detail';state.graph='all';render();}
document.querySelector('.review').addEventListener('click',e=>{let b=e.target.closest('[data-layout]');if(b){state.layout=b.dataset.layout;render();}});for(let k of ['theme','fixture','language'])document.getElementById(k).addEventListener('change',e=>{state[k]=e.target.value;render();});document.getElementById('size').addEventListener('change',e=>{state.width=Number(e.target.value);state.height=state.width===960?640:760;render();});document.getElementById('best-window').addEventListener('click',e=>{let b=e.target.closest('button'),r=e.target.closest('[data-chart]');if(r){openChart(Number(r.dataset.chart));return;}if(!b)return;let d=b.dataset;if(d.back!=null){state.page='list';render();document.querySelector('[data-chart="'+state.selected+'"]')?.focus({preventScroll:true});return;}if(d.nav==='home'){location.href='home-mock.html';return;}if(d.nav==='history'){location.href='play-history-mock.html';return;}if(d.nav==='best'){state.page='list';render();return;}for(let key of ['mode','style','goal','graph','version'])if(d[key]!=null){state[key]=d[key];state.listScroll=0;render();document.querySelector('[data-'+key+'="'+CSS.escape(d[key])+'"]')?.focus({preventScroll:true});return;}if(d.level){state.level=Number(d.level);state.listScroll=0;render();document.querySelector('[data-level="'+d.level+'"]')?.focus({preventScroll:true});}});document.getElementById('best-window').addEventListener('change',e=>{if(e.target.id==='level-select')state.level=Number(e.target.value);if(e.target.id==='version-select')state.version=e.target.value;if(e.target.id==='sort')state.sort=e.target.value;state.listScroll=0;render();});document.getElementById('best-window').addEventListener('input',e=>{if(e.target.id==='song-query'){let caret=e.target.selectionStart;state.query=e.target.value;state.listScroll=0;render();let input=document.getElementById('song-query');input.focus();input.setSelectionRange(caret,caret);}});document.getElementById('best-window').addEventListener('keydown',e=>{let row=e.target.closest('[data-chart]');if(row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openChart(Number(row.dataset.chart));}if(row&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();let next=e.key==='ArrowDown'?row.nextElementSibling:row.previousElementSibling;next?.focus();}});render();
</script></html>
