function render(){
const app=document.getElementById('app-window');
app.className='app '+(state.width<=1100?'narrow ':'')+(state.theme==='dark'?'dark ':'')+'mode-'+state.variant;
app.style.width=state.width+'px';app.style.height=state.height+'px';
document.documentElement.lang=state.language;
document.getElementById('direction').textContent='1280×760では1画面、小窓や長い表示では縦スクロールで確認できます。';
['theme','fixture','language'].forEach(id=>document.getElementById(id).value=state[id]);
document.getElementById('size').value=String(state.width);
app.innerHTML='<div class="chrome"><svg class="app-mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12h3V8h3V4h3V1l4 4h-3v8H2z"/></svg>GP Score Log<div class="window-actions"><span>−</span><span>□</span><span>×</span></div></div><nav class="nav"><span class="brand">GP Score Log</span><div class="nav-group">'+['home','best','history','flare'].map(k=>'<button data-nav="'+k+'" class="'+(state.page===k?'active':'')+'">'+text(k)+'</button>').join('')+'</div><div class="nav-group utility">'+['settings','data'].map(k=>'<button data-nav="'+k+'">'+text(k)+'</button>').join('')+'</div></nav><div class="monitor"><span class="state">'+text('monitor')+'</span><span>'+text('reason')+'</span></div><div class="viewport"><main class="workspace">'+home()+'</main></div>';
}
function toast(message){const viewport=document.querySelector('.viewport');let old=viewport.querySelector('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;viewport.appendChild(el);setTimeout(()=>el.remove(),2600);}
for(const id of ['theme','fixture','language'])document.getElementById(id).addEventListener('change',e=>{state[id]=e.target.value;state.selected=0;render();});
document.getElementById('size').addEventListener('change',e=>{state.width=Number(e.target.value);state.height=state.width===960?640:state.width===1181?775:760;render();});
document.getElementById('app-window').addEventListener('click',async e=>{
let nav=e.target.closest('[data-nav]'),action=e.target.closest('[data-action]'),row=e.target.closest('[data-row]');
if(nav)toast(text('mockOnly'));
if(action){if(action.dataset.action==='history'){toast(text('mockOnly'));}else if(action.dataset.action==='bests')toast(text('mockOnly'));else if(action.dataset.action==='copy'){try{const empty=state.fixture==='old'||state.fixture==='empty';await navigator.clipboard.writeText('2026/10/18\n'+text('plays')+': '+(empty?'0':'18')+'\n'+text('notes')+': '+(empty?'—':'9,248')+'\n'+text('calories')+': '+(empty?'—':'286.4 kcal')+'\n#GP_ScoreLog');toast(text('copied'));}catch{toast(text('copyFail'));}}}
});
render();
</script>
