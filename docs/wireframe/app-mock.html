<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GP Score Log — Gemini Zero-Base Concept v2</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: "Segoe UI Variable", "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: 14px; line-height: 1.5;
  background: #0d1117; color: #e6edf3;
}
button, input, select { font: inherit; color: inherit; }
button, select { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; font-family: "Segoe UI Variable", "Segoe UI", sans-serif; letter-spacing: -.02em; }

/* ===== Outer Showcase Bar ===== */
.showcase-bar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13, 17, 23, .92); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,.1);
  padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
}
.showcase-title { display: flex; align-items: center; gap: 10px; }
.showcase-title h1 { margin: 0; font-size: 15px; font-weight: 700; color: #f8fafc; letter-spacing: -.01em; }
.showcase-pill { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: rgba(96,165,250,.18); color: #93c5fd; border: 1px solid rgba(96,165,250,.35); }
.showcase-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.showcase-controls label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; font-weight: 600; }
.showcase-controls select {
  background: #161b22; color: #f1f5f9; border: 1px solid #30363d; border-radius: 6px;
  padding: 4px 10px; font-size: 12px; font-weight: 600;
}
.stage { padding: 20px 24px 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; overflow-x: auto; }
.concept-strip {
  width: min(1280px, 100%); font-size: 12px; color: #94a3b8;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.concept-strip strong { color: #e2e8f0; }

/* ===== Gemini Concept Design Tokens (Neutral Canvas so DDR Semantic Colors Shine) ===== */
.app-shell {
  --canvas: #0b0f17;
  --rail: #0f1520;
  --surface: #141c2a;
  --surface-2: #1b2537;
  --surface-hover: #212e45;
  --border: rgba(148, 163, 184, .16);
  --border-strong: rgba(148, 163, 184, .32);
  --text: #f1f5f9;
  --text-2: #94a3b8;
  --text-3: #94a3b8;
  --accent: #60a5fa;
  --accent-solid: #3b82f6;
  --accent-soft: rgba(96, 165, 250, .14);
  --on-accent: #ffffff;
  --up: #4ade80;
  --up-bg: rgba(74, 222, 128, .12);
  --down: #fb7185;
  --down-bg: rgba(251, 113, 133, .12);
  --danger: #fb7185;
  --danger-bg: rgba(251, 113, 133, .14);
  --danger-bd: rgba(251, 113, 133, .4);
  --warn-bg: rgba(245, 158, 11, .14);
  --warn-bd: rgba(245, 158, 11, .45);
  --warn-fg: #fcd34d;
  --shadow: 0 24px 64px rgba(0, 0, 0, .55);

  /* DDR Official Semantic Colors (Preserved) */
  --diff-bgn: #5fb8e8; --diff-bgn-bg: #23749c; --diff-bgn-fg: #ffffff;
  --diff-bas: #f3a621; --diff-bas-bg: #b97708; --diff-bas-fg: #ffffff;
  --diff-dif: #e64949; --diff-dif-bg: #b8333a; --diff-dif-fg: #ffffff;
  --diff-exp: #27a85a; --diff-exp-bg: #1f7d49; --diff-exp-fg: #ffffff;
  --diff-cha: #8c55c9; --diff-cha-bg: #6f42a6; --diff-cha-fg: #ffffff;

  /* DDR WORLD Official Flare Category Colors (from playdata.css: CLASSIC=#d29067, WHITE=#b9c9d1, GOLD=#ecbf2f) */
  --flare-classic: #d29067;
  --flare-white: #b9c9d1;
  --flare-gold: #ecbf2f;

  /* Result badges (DDR WORLD faithful, Dark calibrated) */
  --b-gold-bg: #4c3911; --b-gold-bd: #e5b83f; --b-gold-fg: #ffe9a6;
  --b-yellow-bg: #3c4112; --b-yellow-bd: #e0e645; --b-yellow-fg: #f2f78a;
  --b-cyan-bg: #123e52; --b-cyan-bd: #46b9e9; --b-cyan-fg: #b8ecff;
  --b-green-bg: #153f2a; --b-green-bd: #4ad17a; --b-green-fg: #b9f5cd;
  --b-blue-bg: #173a68; --b-blue-bd: #65a8ff; --b-blue-fg: #c7e0ff;
  --b-orange-bg: #5e2405; --b-orange-bd: #ff8c24; --b-orange-fg: #ffe0b2;
  --b-purple-bg: #3b2a59; --b-purple-bd: #b48af5; --b-purple-fg: #e4d4ff;
  --b-bronze-bg: #36241e; --b-bronze-bd: #c98a68; --b-bronze-fg: #eed0be;
  --b-silver-bg: #273545; --b-silver-bd: #cbd5e1; --b-silver-fg: #f1f5f9;
  --b-red-bg: #541b22; --b-red-bd: #f26a78; --b-red-fg: #ffd1d5;
  --b-pink-bg: #531b3c; --b-pink-bd: #e06aae; --b-pink-fg: #ffd0e8;
  --b-slate-bg: #253246; --b-slate-bd: #66768a; --b-slate-fg: #d5dee9;
  --b-ex-bg: linear-gradient(90deg, #68252d 0%, #5a4310 25%, #153f2a 50%, #123e52 75%, #3b2a59 100%);
  --b-ex-bd: #c084fc; --b-ex-fg: #f0e9ff;

  /* Clear Lamp Glow Dots (DDR Clear colors) */
  --lamp-mfc: conic-gradient(#f87171, #facc15, #4ade80, #38bdf8, #c084fc, #f87171);
  --lamp-pfc: #facc15;
  --lamp-gfc: #4ade80;
  --lamp-fc: #60a5fa;
  --lamp-clear: #38bdf8;
  --lamp-failed: #fb7185;

  /* Judgement bar colors */
  --j-marv: #e0f2fe;
  --j-perf: #facc15;
  --j-great: #4ade80;
  --j-good: #38bdf8;
  --j-miss: #fb7185;

  width: 1280px; height: 760px;
  background: var(--canvas); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: 14px;
  box-shadow: var(--shadow); overflow: hidden;
  display: grid; grid-template-columns: 216px minmax(0, 1fr);
  position: relative;
}

.app-shell.light {
  --canvas: #f5f7fa;
  --rail: #ffffff;
  --surface: #ffffff;
  --surface-2: #eef2f6;
  --surface-hover: #e8eef5;
  --border: rgba(15, 23, 42, .10);
  --border-strong: rgba(15, 23, 42, .20);
  --text: #0f172a;
  --text-2: #475569;
  --text-3: #64748b;
  --accent: #2563eb;
  --accent-solid: #2563eb;
  --accent-soft: rgba(37, 99, 235, .10);
  --on-accent: #ffffff;
  --up: #15803d;
  --up-bg: rgba(21, 128, 61, .10);
  --down: #be123c;
  --down-bg: rgba(190, 18, 60, .09);
  --danger: #be123c;
  --danger-bg: #fff1f2;
  --danger-bd: #fda4af;
  --warn-bg: #fffbeb;
  --warn-bd: #f59e0b;
  --warn-fg: #92400e;
  --shadow: 0 24px 60px rgba(15, 23, 42, .16);

  --diff-bgn-bg: #5fb8e8; --diff-bgn-fg: #0b2330;
  --diff-bas-bg: #f3a621; --diff-bas-fg: #2b1a00;
  --diff-dif-bg: #e64949; --diff-dif-fg: #ffffff;
  --diff-exp-bg: #27a85a; --diff-exp-fg: #ffffff;
  --diff-cha-bg: #8c55c9; --diff-cha-fg: #ffffff;

  --flare-classic: #c97c4e;
  --flare-white: #96b3c4;
  --flare-gold: #d9a31e;

  --b-gold-bg: #fef3c7; --b-gold-bd: #eab308; --b-gold-fg: #854d0e;
  --b-yellow-bg: #fef9a6; --b-yellow-bd: #ada21a; --b-yellow-fg: #524600;
  --b-cyan-bg: #e0f2fe; --b-cyan-bd: #38bdf8; --b-cyan-fg: #075985;
  --b-green-bg: #dcfce7; --b-green-bd: #22c55e; --b-green-fg: #166534;
  --b-blue-bg: #dbeafe; --b-blue-bd: #2563eb; --b-blue-fg: #1e3a8a;
  --b-orange-bg: #ffedd5; --b-orange-bd: #f97316; --b-orange-fg: #9a3412;
  --b-purple-bg: #ede9fe; --b-purple-bd: #8b5cf6; --b-purple-fg: #5b21b6;
  --b-bronze-bg: #f7ebe3; --b-bronze-bd: #c27849; --b-bronze-fg: #6b3719;
  --b-silver-bg: #e2e8f0; --b-silver-bd: #7c8fa8; --b-silver-fg: #334155;
  --b-red-bg: #fee2e2; --b-red-bd: #ef4444; --b-red-fg: #991b1b;
  --b-pink-bg: #fce7f3; --b-pink-bd: #f472b6; --b-pink-fg: #9d174d;
  --b-slate-bg: #f1f5f9; --b-slate-bd: #94a3b8; --b-slate-fg: #334155;
  --b-ex-bg: linear-gradient(90deg, #fecaca 0%, #fef3c7 25%, #dcfce7 50%, #e0f2fe 75%, #f3e8ff 100%);
  --b-ex-bd: #a855f7; --b-ex-fg: #0f172a;

  --lamp-pfc: #d97706;
  --lamp-gfc: #16a34a;
  --lamp-fc: #2563eb;
  --lamp-clear: #0284c7;
  --lamp-failed: #e11d48;

  --j-marv: #0284c7;
  --j-perf: #eab308;
  --j-great: #16a34a;
  --j-good: #06b6d4;
  --j-miss: #e11d48;
}

.app-shell.narrow { width: 960px; height: 640px; grid-template-columns: 68px minmax(0, 1fr); }
.app-shell :is(button, input, select):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ===== Left Navigation Rail ===== */
.rail {
  background: var(--rail); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 14px 12px; gap: 6px; min-height: 0;
}
.rail-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.rail-brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.rail-brand-text strong { font-size: 15px; font-weight: 800; letter-spacing: -.03em; }
.rail-brand-text span { font-size: 10.5px; color: var(--text-3); font-weight: 600; }
.rail-section { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: var(--text-3); padding: 8px 10px 4px; }
.rail-item {
  width: 100%; border: 0; background: transparent; color: var(--text-2);
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px;
  font-size: 13px; font-weight: 600; text-align: left; transition: background .12s, color .12s;
}
.rail-item svg { width: 17px; height: 17px; flex-shrink: 0; opacity: .82; }
.rail-item:hover { background: var(--surface-hover); color: var(--text); }
.rail-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.rail-item.active svg { opacity: 1; }
.rail-spacer { flex: 1; }

.live-module {
  background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
  padding: 10px 11px; display: flex; flex-direction: column; gap: 8px;
}
.live-module.error { background: var(--warn-bg); border-color: var(--warn-bd); }
.live-top { display: flex; align-items: center; gap: 8px; }
.pulse-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pulse-dot.ok { background: #22c55e; box-shadow: 0 0 0 4px rgba(34, 197, 94, .2); }
.pulse-dot.wait { background: #38bdf8; }
.pulse-dot.err { background: #ef4444; box-shadow: 0 0 0 4px rgba(239, 68, 68, .22); }
.live-btn {
  width: 100%; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text);
  border-radius: 7px; padding: 5px 8px; font-size: 11.5px; font-weight: 700;
}
.live-btn:hover { border-color: var(--accent); color: var(--accent); }

.app-shell.narrow .rail { padding: 14px 8px; align-items: center; }
.app-shell.narrow .rail-brand { padding: 4px 0 12px; justify-content: center; }
.app-shell.narrow .rail-brand-text,
.app-shell.narrow .rail-section,
.app-shell.narrow .rail-item span,
.app-shell.narrow .live-text,
.app-shell.narrow .live-btn { display: none; }
.app-shell.narrow .rail-item { justify-content: center; padding: 10px; }
.app-shell.narrow .live-module { padding: 10px; align-items: center; }

/* ===== Right Main Column ===== */
.main-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top-bar {
  height: 52px; flex-shrink: 0; padding: 0 24px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.top-bar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top-bar h2 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
.top-bar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.quick-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 0 10px; height: 32px; width: 210px; color: var(--text-2); font-size: 12px;
}
.quick-search input { border: 0; background: transparent; outline: none; width: 100%; color: var(--text); font-size: 12.5px; }
.kbd { font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-3); font-weight: 700; }

.seg {
  display: inline-flex; padding: 3px; border-radius: 9px;
  background: var(--surface-2); border: 1px solid var(--border); gap: 2px;
}
.seg button {
  border: 0; background: transparent; color: var(--text-2);
  padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 700;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0, 0, 0, .18); }

.workspace {
  flex: 1; min-height: 0; overflow-y: auto; padding: 16px 24px 20px;
  display: flex; flex-direction: column; gap: 14px;
}
.app-shell.narrow .top-bar { padding: 0 16px; }
.app-shell.narrow .quick-search { width: 150px; }
.app-shell.narrow .workspace { padding: 14px 16px; gap: 12px; }

/* ===== Cards & Primitives ===== */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.muted { color: var(--text-2); font-size: 12px; }
.label-xs { font-size: 11px; font-weight: 700; color: var(--text-2); letter-spacing: .03em; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 13px; border-radius: 8px;
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text);
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
}
.btn:hover { background: var(--surface-hover); border-color: var(--accent); }
.btn.primary { background: var(--accent-solid); border-color: var(--accent-solid); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--danger-bg); border-color: var(--danger-bd); color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }

/* Difficulty Visuals */
.diff-pill {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 2px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 800; line-height: 1.3; white-space: nowrap;
}
.diff-bgn { background: var(--diff-bgn-bg); color: var(--diff-bgn-fg); }
.diff-bas { background: var(--diff-bas-bg); color: var(--diff-bas-fg); }
.diff-dif { background: var(--diff-dif-bg); color: var(--diff-dif-fg); }
.diff-exp { background: var(--diff-exp-bg); color: var(--diff-exp-fg); }
.diff-cha { background: var(--diff-cha-bg); color: var(--diff-cha-fg); }
.diff-bar { width: 4px; border-radius: 99px; flex-shrink: 0; align-self: stretch; }
.diff-bar.bgn { background: var(--diff-bgn); }
.diff-bar.bas { background: var(--diff-bas); }
.diff-bar.dif { background: var(--diff-dif); }
.diff-bar.exp { background: var(--diff-exp); }
.diff-bar.cha { background: var(--diff-cha); }

/* ===== Refined 3-Axis Evaluation (Instead of 3 Identical Boxes!) ===== */
/* 1. RANK: Borderless bold typography paired directly beside Score (DDR Official 5 color groups from ViewerModels.cs) */
.rank-inline {
  font-weight: 900; letter-spacing: -.03em; line-height: 1;
}
.rank-upper { color: #facc15; }
.rank-b { color: #46b9e9; }
.rank-c { color: #f472b6; }
.rank-d { color: #f26a78; }
.rank-e { color: #94a3b8; }
.app-shell.light .rank-upper { color: #a16207; }
.app-shell.light .rank-b { color: #0369a1; }
.app-shell.light .rank-c { color: #be185d; }
.app-shell.light .rank-d { color: #b91c1c; }
.app-shell.light .rank-e { color: #475569; }

/* Color Palette Popover / Reference Modal */
.palette-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(5, 10, 18, .68); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.palette-modal {
  width: min(1040px, 100%); max-height: calc(100vh - 48px); overflow-y: auto;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: 14px;
  padding: 20px 24px; box-shadow: 0 24px 64px rgba(0,0,0,.45);
  display: flex; flex-direction: column; gap: 18px;
}
.palette-section {
  border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
  background: var(--canvas); display: flex; flex-direction: column; gap: 10px;
}
.palette-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.palette-chip {
  position: relative; display: inline-flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 8px 10px; min-width: 82px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--border);
}
.palette-chip:hover { border-color: var(--accent); }
.palette-chip .chip-meta { font-size: 10px; color: var(--text-2); text-align: center; line-height: 1.25; }
.palette-chip .chip-tip {
  display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  z-index: 20; width: 196px; padding: 7px 9px; border-radius: 7px;
  background: #0f172a; color: #f8fafc; border: 1px solid #334155;
  font-size: 11px; line-height: 1.45; box-shadow: 0 10px 24px rgba(0,0,0,.4); pointer-events: none;
}
.palette-chip:hover .chip-tip { display: block; }
.swatch-mini { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1px solid rgba(255,255,255,.25); }

/* 2. CLEAR: DDR Clear Lamp pill (subtle neutral surface + glowing lamp dot) */
.clear-lamp {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 9px 2px 7px; min-height: 22px; border-radius: 99px;
  background: var(--surface-2); border: 1px solid var(--border-strong);
  font-size: 11px; font-weight: 800; color: var(--text); white-space: nowrap;
}
.lamp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.lamp-mfc { background: var(--lamp-mfc); box-shadow: 0 0 6px rgba(192,132,252,.7); }
.lamp-pfc { background: var(--lamp-pfc); box-shadow: 0 0 6px rgba(250,204,21,.6); }
.lamp-gfc { background: var(--lamp-gfc); box-shadow: 0 0 6px rgba(74,222,128,.55); }
.lamp-fc { background: var(--lamp-fc); }
.lamp-clear { background: var(--lamp-clear); }
.lamp-failed { background: var(--lamp-failed); }

/* 3. FLARE: Official DDR Flare Badge */
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 2px 8px; min-height: 22px; border-radius: 5px;
  border: 1px solid var(--b-slate-bd); background: var(--b-slate-bg); color: var(--b-slate-fg);
  font-size: 10.5px; font-weight: 800; white-space: nowrap;
}
.badge.gold { background: var(--b-gold-bg); border-color: var(--b-gold-bd); color: var(--b-gold-fg); }
.badge.yellow { background: var(--b-yellow-bg); border-color: var(--b-yellow-bd); color: var(--b-yellow-fg); }
.badge.cyan { background: var(--b-cyan-bg); border-color: var(--b-cyan-bd); color: var(--b-cyan-fg); }
.badge.green { background: var(--b-green-bg); border-color: var(--b-green-bd); color: var(--b-green-fg); }
.badge.blue { background: var(--b-blue-bg); border-color: var(--b-blue-bd); color: var(--b-blue-fg); }
.badge.orange { background: var(--b-orange-bg); border-color: var(--b-orange-bd); color: var(--b-orange-fg); }
.badge.purple { background: var(--b-purple-bg); border-color: var(--b-purple-bd); color: var(--b-purple-fg); }
.badge.bronze { background: var(--b-bronze-bg); border-color: var(--b-bronze-bd); color: var(--b-bronze-fg); }
.badge.silver { background: var(--b-silver-bg); border-color: var(--b-silver-bd); color: var(--b-silver-fg); }

function toast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { if (state.toast === msg) { state.toast = ''; render(); } }, 2200);
}

function renderShell(title, bodyHtml, { showStyle = true, leftExtra = '' } = {}) {

  const navUtil = [['settings', '設定'], ['data', '記録の管理']];
  // Active nav reflects where the user came from when viewing Chart Detail!
  const active = state.screen === 'detail' ? state.detailOrigin : state.screen;

  const monMeta = {
    ok: { cls: 'ok', title: '自動記録中', sub: 'リザルトを待っています', btn: '自動記録を止める' },
    wait: { cls: 'wait', title: 'ゲームを待っています', sub: 'GP未起動', btn: '自動記録を始める' },
    err: { cls: 'err', title: '画面を取得できません', sub: 'サイズ変更を検出', btn: '再開する' },
  }[state.mon];

  return `
  <div class="app-shell ${state.theme === 'light' ? 'light' : ''} ${state.size === 'narrow' ? 'narrow' : ''}">
    <aside class="rail">
      <div class="rail-brand">
        ${brandMark()}
        <div class="rail-brand-text">
          <strong>GP Score Log</strong>
          <span>DDR GRAND PRIX</span>
        </div>
      </div>

      <div class="rail-section">記録を見る</div>
      ${navMain.map(([id, label]) => `
        <button class="rail-item ${active === id ? 'active' : ''}" data-nav="${id}" title="${label}">
          ${ICONS[id]}<span>${label}</span>
        </button>`).join('')}

      <div class="rail-section" style="margin-top:8px">管理</div>
      ${navUtil.map(([id, label]) => `
        <button class="rail-item ${active === id ? 'active' : ''}" data-nav="${id}" title="${label}">
          ${ICONS[id]}<span>${label}</span>
        </button>`).join('')}

      <div class="rail-spacer"></div>

      <div class="live-module ${state.mon === 'err' ? 'error' : ''}" title="${monMeta.title} — ${monMeta.sub}">
        <div class="live-top">
          <span class="pulse-dot ${monMeta.cls}"></span>
          <div class="live-text" style="min-width:0">
            <div style="font-size:12px;font-weight:700;line-height:1.2">${monMeta.title}</div>
            <div style="font-size:11px;color:var(--text-2)">${monMeta.sub}</div>
          </div>
        </div>
        <button class="live-btn" data-act="toggle-mon">${monMeta.btn}</button>
      </div>
    </aside>

    <section class="main-col">
      <header class="top-bar">
        <div class="top-bar-left">
          ${leftExtra}
          <h2>${title}</h2>
        </div>
        <div class="top-bar-right">
          <label class="quick-search" title="どの画面からでも曲名検索へ移動できます">
            <span>⌕</span>
            <input id="global-search" type="search" value="${esc(state.query)}" placeholder="曲名で探す…">
            <span class="kbd">⌘K</span>
          </label>
          ${showStyle ? `<div class="seg">
            <button data-style="SP" aria-pressed="${state.style === 'SP'}">SINGLE</button>
            <button data-style="DP" aria-pressed="${state.style === 'DP'}">DOUBLE</button>
          </div>` : ''}
        </div>
      </header>

      ${state.mon === 'err' ? `
        <div style="padding:8px 24px;background:var(--warn-bg);border-bottom:1px solid var(--warn-bd);color:var(--warn-fg);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px">

          <button class="btn" style="height:28px;font-size:11.5px" data-act="toggle-mon">自動記録を再開</button>
        </div>` : ''}

      <main class="workspace">${bodyHtml}</main>
    </section>

    ${state.showPalette ? renderPaletteModal() : ''}

  </div>`;
}

  const isGoal = state.bestMode === 'goal';
  return renderShell('自己ベスト', `

          </div>
          <div class="switch-row">
            <div><strong style="font-size:13.5px">記録できなかった結果を知らせる</strong><div class="muted">プレーの邪魔をせず、画面の上に3秒ほどお知らせを出します</div></div>
            <button class="toggle-pill" data-act="toggle-notify" aria-pressed="${state.notifyFail}"></button>
          </div>
        </section>

        <section class="card">
          <div class="label-xs">画面の色（選ぶとすぐ確認できます）</div>
          <div class="theme-cards">
            <button class="theme-card" data-set-theme="dark" aria-pressed="${state.theme === 'dark'}">
              <div class="theme-thumb" style="background:#0b0f17"><div style="width:12px;background:#141c2a;border-radius:3px"></div><div style="flex:1;background:#1b2537;border-radius:3px"></div></div>
              <strong style="font-size:12px">暗い</strong>
            </button>
            <button class="theme-card" data-set-theme="light" aria-pressed="${state.theme === 'light'}">
              <div class="theme-thumb" style="background:#f5f7fa"><div style="width:12px;background:#ffffff;border-radius:3px"></div><div style="flex:1;background:#e2e8f0;border-radius:3px"></div></div>
              <strong style="font-size:12px">明るい</strong>
            </button>
            <button class="theme-card" data-set-theme="dark" aria-pressed="false">
              <div class="theme-thumb" style="background:linear-gradient(135deg,#f5f7fa 50%,#0b0f17 50%)"></div>
              <strong style="font-size:12px">Windowsに合わせる</strong>
            </button>
          </div>
        </section>
      </div>

      <section class="card" style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div class="label-xs">Webに自己ベストを送る</div>
            <strong style="font-size:15px">公開ページの同期</strong>
          </div>
          <span class="delta-pill up" style="font-size:11.5px">● 送信ON</span>
        </div>
        <div class="muted">最後に送った日時：<strong class="num" style="color:var(--text)">2026/11/28 14:26</strong> · Google連携済み</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn primary" data-act="sync-now">今すぐ送る</button>
          <button class="btn">公開ページを開く</button>
          <button class="btn">送信を止める</button>
        </div>
        <div style="border-top:1px solid var(--border);padding-top:12px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn danger" data-act="danger-demo">このPCのログイン情報を消す</button>
          <button class="btn danger" data-act="danger-demo">Google連携を解除</button>
        </div>
      </section>
    </div>
  `, { showStyle: false });
}

/* ===== 7. Data Management ===== */
function viewData() {
  return renderShell('記録の管理', `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
      <section class="card"><span class="label-xs">プレー記録</span><strong class="num" style="display:block;font-size:28px;margin-top:4px">1,284件</strong></section>
      <section class="card"><span class="label-xs">記録のある譜面</span><strong class="num" style="display:block;font-size:28px;margin-top:4px">412譜面</strong></section>
      <section class="card"><span class="label-xs">記録の状態</span><strong style="display:block;font-size:24px;color:var(--up);margin-top:6px">● 正常</strong></section>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1.15fr;gap:16px">
      <section class="card" style="display:flex;flex-direction:column;gap:12px">
        <div class="label-xs">記録のコピー</div>
        <div class="muted">最後に保存した日時：<strong class="num" style="color:var(--text)">2026/11/28 14:26</strong></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn primary" data-act="backup">コピーを保存</button>
          <button class="btn danger" data-act="danger-demo">コピーから戻す</button>
        </div>
        <div style="border-top:1px solid var(--border);padding-top:12px">
          <div class="label-xs">曲・譜面の情報</div>
          <div style="margin-top:4px;font-weight:700">6,482 譜面収録 · v0.6.4</div>
        </div>
      </section>

      <section class="card" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="label-xs">リザルト画像から記録する</span>
          <span class="badge cyan">待機中</span>
        </div>
        <div style="flex:1;min-height:130px;border:1.5px dashed var(--border-strong);border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center">
          <strong>画像をここに置く</strong>
          <span class="muted">DDR GRAND PRIXのリザルト画像（PNG・1280×720）をまとめて選べます</span>
          <button class="btn primary">画像を選ぶ</button>
        </div>
      </section>
    </div>
  `, { showStyle: false });
}

function render() {
  document.getElementById('g-stress').value = state.stress;
  document.getElementById('g-theme').value = state.theme;
  document.getElementById('g-size').value = state.size;
  document.getElementById('g-mon').value = state.mon;
  const views = { home: viewHome, bests: viewBests, detail: viewDetail, history: viewHistory, flare: viewFlare, settings: viewSettings, data: viewData };
  document.getElementById('mount').innerHTML = (views[state.screen] || viewHome)();

  const gs = document.getElementById('global-search');
  if (gs) {
    gs.addEventListener('input', e => {
      state.query = e.target.value;
      if (state.screen !== 'bests') state.screen = 'bests';
      render();
      const el = document.getElementById('global-search');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-nav],[data-style],[data-home-detail],[data-bests-detail],[data-history-detail],[data-home-history],[data-sel-h],[data-bmode],[data-lv],[data-ver],[data-goal],[data-gmode],[data-set-theme],[data-act]');
  if (!el) return;
  if (el.dataset.nav) {
    if (el.dataset.nav === 'history') state.historyOrigin = null;
    state.screen = el.dataset.nav;
    render();
    return;
  }
  if (el.dataset.style) { state.style = el.dataset.style; render(); return; }
  if (el.dataset.homeDetail) { state.selectedChart = Number(el.dataset.homeDetail); state.detailOrigin = 'home'; state.screen = 'detail'; render(); return; }
  if (el.dataset.bestsDetail) { state.selectedChart = Number(el.dataset.bestsDetail); state.detailOrigin = 'bests'; state.screen = 'detail'; render(); return; }
  if (el.dataset.historyDetail) { state.selectedChart = Number(el.dataset.historyDetail); state.detailOrigin = 'history'; state.screen = 'detail'; render(); return; }
  if (el.dataset.homeHistory) { state.selectedHistory = Number(el.dataset.homeHistory); state.historyOrigin = 'home'; state.screen = 'history'; render(); return; }
  if (el.dataset.selH) { state.selectedHistory = Number(el.dataset.selH); render(); return; }
  if (el.dataset.bmode) { state.bestMode = el.dataset.bmode; render(); return; }
  if (el.dataset.lv) { state.bestLevel = Number(el.dataset.lv); render(); return; }
  if (el.dataset.ver) { state.bestVersion = el.dataset.ver; render(); return; }
  if (el.dataset.goal) { state.bestGoal = el.dataset.goal; render(); return; }
  if (el.dataset.gmode) { state.graphMode = el.dataset.gmode; render(); return; }
  if (el.dataset.setTheme) { state.theme = el.dataset.setTheme; render(); return; }

  const a = el.dataset.act;
  if (a === 'toggle-mon') { state.mon = state.mon === 'ok' ? 'wait' : 'ok'; render(); }
  else if (a === 'copy-today') toast('今日の記録をコピーしました');
  else if (a === 'toggle-auto') { state.autoStart = !state.autoStart; render(); }
  else if (a === 'toggle-notify') { state.notifyFail = !state.notifyFail; render(); }
  else if (a === 'sync-now') toast('Webへの自己ベスト送信を始めました');
  else if (a === 'backup') toast('記録のコピーを保存しました');
  else if (a === 'danger-demo') toast('確認のあと、安全に実行されます');
  else if (a === 'close-palette' && (!el.classList.contains('palette-overlay') || e.target === el)) { state.showPalette = false; render(); }
  else if (a === 'flip-theme') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(); }
});

document.getElementById('g-palette-btn').addEventListener('click', () => { state.showPalette = !state.showPalette; render(); });

document.getElementById('g-stress').addEventListener('change', e => { state.stress = e.target.value; render(); });
document.getElementById('g-theme').addEventListener('change', e => { state.theme = e.target.value; render(); });
document.getElementById('g-size').addEventListener('change', e => { state.size = e.target.value; render(); });
document.getElementById('g-mon').addEventListener('change', e => { state.mon = e.target.value; render(); });

render();
</script>
</body>
</html>
