<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GP Score Log — プレー履歴 / Issue #249</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6e8e3;color:#252722;font:14px/1.5 "Segoe UI","Yu Gothic UI",sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #739d7d;outline-offset:2px}.review{padding:20px 28px;background:white}.review h1{font-size:20px;margin:0 0 8px}.controls{display:flex;gap:16px;flex-wrap:wrap}.stage{padding:24px;overflow:auto}.app{--bg:#faf9f6;--surface:#f0efe9;--line:#dcddd5;--text:#252722;--sub:#666c61;--accent:#38644b;--selected:#e8eee5;--gold:#fff5cc;--gold-text:#74550f;--blue:#e6f5fc;--blue-text:#175774;background:var(--bg);color:var(--text);width:1280px;height:760px;border:1px solid #b5b9ae;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;margin:auto}.app.dark{--bg:#191d19;--surface:#252b25;--line:#3c443b;--text:#f2f1e9;--sub:#bbc3b4;--accent:#92bd9d;--selected:#2d4032;--gold:#42391c;--gold-text:#f4d67e;--blue:#20323d;--blue-text:#a0d9ef}.chrome{height:31px;padding:5px 12px;background:var(--surface);font-size:12px;border-bottom:1px solid var(--line)}.nav{height:60px;display:flex;align-items:center;gap:12px;padding:0 30px;border-bottom:1px solid var(--line)}.brand{font-size:24px;font-weight:600;margin-right:12px;white-space:nowrap}.nav button{border:0;border-bottom:2px solid transparent;background:none;color:var(--sub);padding:18px 7px;white-space:nowrap}.nav .active{color:var(--accent);border-color:var(--accent)}.utility{margin-left:auto;display:flex;gap:8px}.monitor{height:33px;padding:7px 30px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub)}.monitor strong{color:var(--accent);margin-right:14px}.workspace{padding:20px 32px 24px;display:flex;flex:1;min-height:0;flex-direction:column}.workspace h2{font-size:28px;margin:0 0 16px;font-weight:600}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;flex:1;min-height:0;gap:24px}.list{display:flex;flex-direction:column;min-height:0;min-width:0}.scroller{flex:1;min-height:0;overflow:auto;border:1px solid var(--line)}table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:12px}thead{position:sticky;top:0;z-index:3;background:var(--surface)}th{height:32px;font-size:11px;font-weight:400;text-align:left;padding:4px 7px;color:var(--sub);border-bottom:1px solid var(--line)}td{padding:4px 7px;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}tr.play{height:48px;cursor:pointer}tr.play:hover,tr.selected{background:var(--selected)}tr.selected td:first-child{box-shadow:inset 3px 0 var(--accent)}.date td{height:28px;background:var(--surface);color:var(--sub)}.date{position:sticky;top:32px;z-index:2}.num{text-align:right;font-variant-numeric:tabular-nums}.score{font-weight:600}.difficulty{display:inline-block;background:#d23847;color:white;border-radius:4px;padding:2px 5px;font-size:11px;font-weight:600}.expert{background:#238c50}.challenge{background:#8051b6}.level{display:block;color:var(--sub);font-size:11px}.badge{display:inline-block;background:var(--gold);color:var(--gold-text);border:1px solid #bba45b;border-radius:5px;font-size:11px;padding:4px 7px;white-space:nowrap}.clear{background:var(--blue);color:var(--blue-text);border-color:#87aabc}.count{font-size:12px;color:var(--sub);margin:6px 4px 0}.detail{border-left:1px solid var(--line);padding-left:24px;overflow:auto;min-width:0}.detail h3{font-size:20px;margin:0 0 6px;font-weight:600;overflow-wrap:anywhere}.detail .meta{display:flex;gap:6px;align-items:center;font-size:12px;flex-wrap:wrap}.big{font-size:36px;color:var(--accent);font-weight:700;line-height:1.2;margin-top:14px;white-space:nowrap}.ex{font-size:12px;color:var(--sub);margin-top:4px}.badges{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.judgments{margin-top:24px}.caption{font-size:12px;color:var(--sub);margin-bottom:6px}.judgments dl{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:12px;margin:0}.judgments dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}.timestamp{margin-top:20px;font-size:12px}.timestamp time{display:block;border-top:1px solid var(--line);padding-top:8px}.state{padding:24px;font-size:16px}.narrow{width:960px;height:640px}.narrow .workspace{padding:20px}.narrow .nav{padding:0 20px;gap:7px}.narrow .brand{font-size:22px;margin-right:8px}.narrow .nav button{font-size:12px;padding:18px 5px}.narrow .layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1.4fr) minmax(0,1fr);gap:14px}.narrow tr.play{height:40px}.narrow .level{display:inline;margin-left:4px}.narrow .detail{border-left:0;border-top:1px solid var(--line);padding:12px 0 0;display:grid;grid-template-columns:1.1fr 1.2fr .9fr;gap:20px}.narrow .big{font-size:32px;display:inline-block;margin-right:8px}.narrow .ex{display:inline}.narrow .judgments,.narrow .timestamp{margin-top:0}.narrow .judgments dl{grid-template-columns:1fr auto 1fr auto;gap:9px}.note{font-size:12px;color:#535d50;margin:12px 24px}
</style>
<header class="review"><h1>プレー履歴の表示例</h1><div class="controls">
<label>画面 <select id="size"><option value="wide">1280 × 760</option><option value="narrow">960 × 640</option></select></label>
<label>表示 <select id="theme"><option value="light">ライト</option><option value="dark">ダーク</option></select></label>
<label>状態 <select id="fixture"><option value="normal">通常</option><option value="long">長い曲名</option><option value="empty">記録なし</option><option value="loading">読込中</option><option value="error">失敗</option></select></label>
<label>言語 <select id="language"><option value="ja">日本語</option><option value="en">English</option><option value="ko">한국어</option></select></label></div></header>
<div class="stage"><section class="app" id="app"><div class="chrome">GP Score Log <span style="float:right">−　□　×</span></div><nav class="nav" id="nav"></nav><div class="monitor" id="monitor"></div><main class="workspace"><h2 id="heading"></h2><div class="layout" id="layout"></div></main></section></div>
<p class="note">表示を確認するための画面です。記録や設定は変わりません。</p>
<script>
const copy={ja:{nav:['ホーム','自己ベスト','プレー履歴','フレアスキル','設定','記録の管理'],date:'日時',title:'曲名',chart:'譜面',rank:'ランク',judgments:'判定',played:'プレー日時',count:n=>`${n}件を表示`,empty:'プレーの記録はありません',loading:'記録を読み込んでいます',error:'記録を読み込めません。ファイルを確認して、もう一度お試しください。',wait:'ゲーム待機中',reason:'DDR GRAND PRIXの起動を待っています。'},en:{nav:['Home','Personal bests','Play history','Flare skill','Settings','Manage records'],date:'Date / time',title:'Song title',chart:'Chart',rank:'Rank',judgments:'Judgments',played:'Played at',count:n=>`${n} plays shown`,empty:'No plays recorded',loading:'Loading records',error:'Cannot read records. Check the file and try again.',wait:'Waiting for game',reason:'Waiting for DDR GRAND PRIX to start.'},ko:{nav:['홈','개인 최고 기록','플레이 기록','플레어 스킬','설정','기록 관리'],date:'날짜/시간',title:'곡명',chart:'채보',rank:'랭크',judgments:'판정',played:'플레이 일시',count:n=>`${n}건 표시`,empty:'플레이 기록이 없습니다',loading:'기록을 읽는 중',error:'기록을 읽을 수 없습니다. 파일을 확인하고 다시 시도하세요.',wait:'게임 대기 중',reason:'DDR GRAND PRIX 실행을 기다리고 있습니다.'}};
const titles=['POSSESSION','GHOST KINGDOM','ミッドナイト☆WAR','量子の海のリントヴルム','In The Breeze','風鈴花火'];
let selected=1;
const rows=Array.from({length:36},(_,i)=>({date:`2026/10/${String(18-Math.floor(i/6)).padStart(2,'0')}`,time:`14:${String(49-i%6*3).padStart(2,'0')}`,title:titles[i%6],chart:i%6===4?'DP CHA':i%2?'SP EXP':'SP DIF',full:i%6===4?'DP CHALLENGE':i%2?'SP EXPERT':'SP DIFFICULT',kind:i%6===4?'challenge':i%2?'expert':'',score:988230-i*1000,ex:1398-i*2,level:i%6===5?8:14}));
function song(r){return fixture.value==='long'?'アルストロメリア (walk with you remix) — 比較用の長い曲名 / A very long title for checking wrapping':r.title}
function badge(r,full=false){return `<span class="difficulty ${r.kind}">${full?r.full:r.chart}</span><span class="level">Lv.${r.level}</span>`}
function result(){return '<span class="badge">AAA</span> <span class="badge clear">CLEAR</span> <span class="badge">FLARE IX</span>'}
function detail(){const c=copy[language.value],r=rows[selected];document.getElementById('detail').innerHTML=`<section><h3>${song(r)}</h3><div class="meta">${badge(r,true)}</div><div class="big">${r.score.toLocaleString('en-US')}</div><div class="ex">EX SCORE <b>${r.ex.toLocaleString('en-US')}</b></div><div class="badges">${result()}</div></section><section class="judgments"><div class="caption">${c.judgments}</div><dl>${['MARVELOUS','PERFECT','GREAT','GOOD','MISS','MAX COMBO'].map((j,i)=>`<dt>${j}</dt><dd>${[400+selected,80,10,2,1,500+selected][i]}</dd>`).join('')}</dl></section><section class="timestamp"><div class="caption">${c.played}</div><time>${r.date} ${r.time}:00</time></section>`}
function choose(i){selected=i;document.querySelectorAll('tr.play').forEach(r=>r.classList.toggle('selected',+r.dataset.row===i));detail()}
function render(){const c=copy[language.value];app.className=`app ${size.value==='narrow'?'narrow':''} ${theme.value==='dark'?'dark':''}`;document.documentElement.lang=language.value;nav.innerHTML='<strong class="brand">GP Score Log</strong>'+c.nav.slice(0,4).map((n,i)=>`<button class="${i===2?'active':''}">${n}</button>`).join('')+'<span class="utility">'+c.nav.slice(4).map(n=>`<button>${n}</button>`).join('')+'</span>';monitor.innerHTML=`<strong>● ${c.wait}</strong>${c.reason}`;heading.textContent=c.nav[2];if(['empty','loading','error'].includes(fixture.value)){layout.innerHTML=`<div class="state">${c[fixture.value]}</div>`;return}let date='';const body=rows.map((r,i)=>{const header=r.date!==date?`<tr class="date"><td colspan="8">${r.date}</td></tr>`:'';date=r.date;return header+`<tr class="play ${i===selected?'selected':''}" data-row="${i}" tabindex="${i===selected?0:-1}"><td title="${r.date} ${r.time}:00">${r.time}</td><td title="${song(r)}">${song(r)}</td><td title="${r.full}">${badge(r)}</td><td class="num score">${r.score.toLocaleString('en-US')}</td><td class="num">${r.ex.toLocaleString('en-US')}</td><td><span class="badge">AAA</span></td><td><span class="badge clear">CLEAR</span></td><td><span class="badge">IX</span></td></tr>`}).join('');layout.innerHTML=`<div class="list"><div class="scroller" id="scroll"><table aria-label="${c.nav[2]}"><colgroup><col style="width:64px"><col><col style="width:116px"><col style="width:88px"><col style="width:80px"><col style="width:64px"><col style="width:84px"><col style="width:70px"></colgroup><thead><tr>${[c.date,c.title,c.chart,'SCORE','EX SCORE',c.rank,'CLEAR','FLARE'].map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div><p class="count">${c.count(rows.length)}</p></div><aside class="detail" id="detail"></aside>`;detail();document.querySelectorAll('tr.play').forEach(r=>{r.onclick=()=>{choose(+r.dataset.row);r.focus()};r.onkeydown=e=>{if(!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const i=Math.max(0,Math.min(rows.length-1,selected+(e.key==='ArrowUp'?-1:1)));choose(i);const next=document.querySelector(`[data-row="${i}"]`);next.focus({preventScroll:true});const scroller=document.getElementById('scroll');const box=scroller.getBoundingClientRect(),rect=next.getBoundingClientRect();if(rect.top<box.top+60)scroller.scrollTop-=box.top+60-rect.top;if(rect.bottom>box.bottom)scroller.scrollTop+=rect.bottom-box.bottom;}})}
[size,theme,fixture,language].forEach(e=>e.onchange=render);render();
</script>
</html>
