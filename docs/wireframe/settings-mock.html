<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GP Score Log — 設定・記録の管理</title>
<link rel="stylesheet" href="settings-data-mock.css">
</head>
<body data-page="settings">
<header class="review"><h1>設定・記録の管理の画面案</h1><p>操作を目的別にまとめ、設定の保存は常に見える位置に置きます。</p><div class="review-controls"><div class="switch"><button data-page="settings" aria-pressed="true">設定</button><button data-page="data" aria-pressed="false">記録の管理</button></div><label>画面<select id="size"><option value="1280">1280 × 760</option><option value="960">960 × 640</option></select></label><label>表示<select id="theme"><option value="light">ライト</option><option value="dark">ダーク</option></select></label><label>状態<select id="fixture"><option value="ready">通常</option><option value="unlinked">Web未連携</option><option value="auth">Web再連携が必要</option><option value="pending">Web連携待ち</option><option value="syncing">Web送信中</option><option value="importing">画像取込中</option><option value="results">画像取込結果</option><option value="error">エラー例</option></select></label><label>言語<select id="language"><option value="ja">日本語</option><option value="en">English</option><option value="ko">한국어</option></select></label></div><div class="direction">表示確認用サンプルです。保存・Web連携・送信・バックアップ・復元・ファイル取込は未接続で、ボタンを押しても実操作は行いません。</div></header>
<div class="stage"><div id="utility-window" class="app utility-app"></div><p class="note-bar">表示確認用です。保存・送信・認証・復元・画像読込は実行しません。</p></div>
<script src="settings-data-mock.js"></script>
</body>
</html>
