<header class="review"><h1>フレアスキルの画面案</h1><p>ランク・総合値・次の段階を確認し、3カテゴリの対象譜面を見比べます。</p><div class="review-controls"><label>画面<select id="size"><option value="1280">1280 × 760</option><option value="960">960 × 640</option></select></label><label>表示<select id="theme"><option value="light">ライト</option><option value="dark">ダーク</option></select></label><label>状態<select id="fixture"><option value="normal">通常</option><option value="long">長い曲名</option><option value="empty">対象実績なし</option><option value="few">30譜面未満</option><option value="highest">最高ランク</option><option value="excluded">算出対象外あり</option><option value="unavailable">算出不可</option></select></label><label>言語<select id="language"><option value="ja">日本語</option><option value="en">English</option><option value="ko">한국어</option></select></label></div><div class="direction">現行の3列と列ごとのスクロール、次点31位の固定表示を保ち、上部と一覧の余白・文字の強弱を整えた案です。</div></header>

let state={width:1280,height:760,theme:'light',fixture:'normal',language:'ja',style:'SP'};
const q=new URLSearchParams(location.search);for(let k of ['theme','fixture','language','style'])if(q.has(k))state[k]=q.get(k);if(q.get('width')==='960'){state.width=960;state.height=640;}

function categories(){return categoryInfo.map((c,j)=>{let count=state.fixture==='empty'?0:state.fixture==='few'?3:30;let list=Array.from({length:count},(_,i)=>{let point={...pointTemplate[(i+(state.style==='DP'?2:0))%10]};if(i%10===0&&state.style==='SP'){if(j===0)point={level:14,flare:'IX',points:885};if(j===2)point={level:15,flare:'EX',points:960};}if(state.fixture==='highest')point={level:19,flare:'EX',points:1064};return{...point,song:state.fixture==='long'&&i===0?'アルストロメリア (walk with you remix) — 比較用の長い曲名':c.songs[i%10],difficulty:['EXPERT','DIFFICULT','CHALLENGE'][Math.floor(i/10)],order:i};}).sort((a,b)=>b.points-a.points||a.order-b.order).map((v,i)=>({...v,position:i+1}));return{...c,rows:list,total:list.reduce((s,v)=>s+v.points,0),runner:count===30?{song:c.runner,difficulty:'EXPERT',level:15,flare:'IV',points:744}:null};});}
const rankSteps=[['NONE',0],['NONE +',500],['NONE ++',1000],['NONE +++',1500],['MERCURY',2000],['MERCURY +',3000],['MERCURY ++',4000],['MERCURY +++',5000],['VENUS',6000],['VENUS +',7000],['VENUS ++',8000],['VENUS +++',9000],['EARTH',10000],['EARTH +',11500],['EARTH ++',13000],['EARTH +++',14500],['MARS',16000],['MARS +',18000],['MARS ++',20000],['MARS +++',22000],['JUPITER',24000],['JUPITER +',26500],['JUPITER ++',29000],['JUPITER +++',31500],['SATURN',34000],['SATURN +',36750],['SATURN ++',39500],['SATURN +++',42250],['URANUS',45000],['URANUS +',48750],['URANUS ++',52500],['URANUS +++',56250],['NEPTUNE',60000],['NEPTUNE +',63750],['NEPTUNE ++',67500],['NEPTUNE +++',71250],['SUN',75000],['SUN +',78750],['SUN ++',82500],['SUN +++',86250],['WORLD',90000]];
function summary(cats){let total=cats.reduce((n,c)=>n+c.total,0),i=rankSteps.findLastIndex(v=>total>=v[1]),rank=rankSteps[i],next=rankSteps[i+1],main=rank[0].split(' ')[0],sub=rank[0].split(' ')[1]??'',jp={NONE:'なし',MERCURY:'水星',VENUS:'金星',EARTH:'地球',MARS:'火星',JUPITER:'木星',SATURN:'土星',URANUS:'天王星',NEPTUNE:'海王星',SUN:'太陽',WORLD:'世界'}[main],progress=next?100*(total-rank[1])/(next[1]-rank[1]):100;return '<section class="flare-summary"><div><span class="caption">'+({ja:'ランク',en:'Rank',ko:'랭크'}[state.language])+'</span><div class="rank-value" data-rank="'+main+'"><span class="rank-name">'+main+'</span><small>'+sub+'</small></div>'+(state.language==='ja'?'<span class="caption">'+jp+'</span>':'')+'</div><div class="total-block"><span class="caption">'+({ja:'合計',en:'Total',ko:'합계'}[state.language])+'</span><div class="total-value num">'+fmt(total)+'</div></div><div class="next-block"><span class="caption">'+t('next')+'</span><div class="next-top"><strong class="remaining num">'+(next?t('remaining')(fmt(next[1]-total)):t('reached'))+'</strong><span class="next-threshold">'+(next?next[0]+' / '+fmt(next[1]):t('highest'))+'</span></div><progress class="rank-progress" max="100" value="'+progress+'" aria-label="'+t('progress')+'"></progress></div></section>';}
function result(r){return '<div class="skill-result"><span class="badge '+('flare-'+r.flare.toLowerCase())+'">FLARE '+r.flare+'</span><strong class="skill-points num">'+fmt(r.points)+'</strong></div>';}
function song(r){return '<div style="min-width:0"><div class="skill-song" title="'+esc(r.song)+'">'+esc(r.song)+'</div><div class="skill-chart"><span class="difficulty '+r.difficulty.toLowerCase()+'" title="'+r.difficulty+'">'+{EXPERT:'EXP',DIFFICULT:'DIF',CHALLENGE:'CHA'}[r.difficulty]+'</span><span class="level">Lv.'+r.level+'</span></div></div>';}
function category(c){return '<section class="category '+c.name.toLowerCase()+'" aria-label="'+c.name+'"><header class="category-head"><div class="category-title"><h3>'+c.name+'</h3><span class="category-range">'+c.range+'</span></div><div class="category-total"><strong class="num">'+fmt(c.total)+'</strong><small>'+c.rows.length+' / 30</small></div></header><div class="category-list" tabindex="0" aria-label="'+c.name+' TARGET">'+(c.rows.length?c.rows.map(r=>'<div class="skill-row"><span class="position num">'+r.position+'</span>'+song(r)+result(r)+'</div>').join(''):'<div class="empty-category">'+t('none')+'</div>')+'</div>'+(c.runner?'<footer class="runner-up"><span class="runner-caption">'+t('runner')+'</span>'+song(c.runner)+result(c.runner)+'</footer>':'')+'</section>';}

Object.assign(text.en,{next:'To the next rank',runner:'Next candidate #31',none:'No eligible records',disclaimer:'Values may differ from those in the game.',conditions:'Records used for calculation',details:'Uses saved FLARE I–EX records and current song and chart information. Songs currently playable in GP include past arcade songs.',excluded:n=>'Records left out: '+n,unknown:' (unknown SINGLE / DOUBLE: 1)',exclusionReason:'Missing song or chart information, inconsistent records, or similar issues prevent calculation.'});
Object.assign(text.ko,{next:'다음 랭크까지',runner:'다음 후보 31위',none:'대상 기록이 없습니다',disclaimer:'게임 내 수치와 다를 수 있습니다.',conditions:'계산에 쓰는 기록',details:'저장된 FLARE I~EX 기록과 현재 곡·보면 정보를 사용합니다. 지금 GP에서 플레이할 수 있는 과거 아케이드 곡도 포함합니다.',excluded:n=>'계산에서 빠진 기록: '+n+'건',unknown:' (SINGLE / DOUBLE 불명: 1건)',exclusionReason:'곡·보면 정보 부족이나 기록 불일치 등의 이유로 계산에 쓸 수 없습니다.'});
Object.assign(text.ja,{disclaimer:'ゲーム内の数値と異なる場合があります。',conditions:'計算に使う記録',details:'保存済みのFLARE I〜EXと現在の曲・譜面の情報を使います。いまGPで遊べる曲は、過去のアーケード曲も含みます。',exclusionReason:'曲・譜面の情報不足や記録の不整合などがあるため、計算に使えません。'});
