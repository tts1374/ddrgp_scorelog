<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GP Score Log — Web Zero-Base Redesign Concept</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: "Segoe UI Variable", "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: 14px; line-height: 1.6;
  background: #0d1117; color: #e6edf3;
}
button, input, select { font: inherit; color: inherit; }
button, select { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; font-family: "Segoe UI Variable", "Segoe UI", sans-serif; letter-spacing: -.02em; }

/* ===== Outer Showcase Bar (Review-Only Chrome) ===== */
.showcase-bar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13, 17, 23, .92); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,.1);
  padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.showcase-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.showcase-title h1 { margin: 0; font-size: 15px; font-weight: 700; color: #f8fafc; }
.showcase-pill { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: rgba(96,165,250,.18); color: #93c5fd; border: 1px solid rgba(96,165,250,.35); }
.showcase-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.showcase-controls label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; font-weight: 600; }
.showcase-controls select {
  background: #161b22; color: #f1f5f9; border: 1px solid #30363d; border-radius: 6px;
  padding: 4px 10px; font-size: 12px; font-weight: 600;
}
.nav-link-chip {
  text-decoration: none; font-size: 12px; font-weight: 700; color: #e2e8f0;
  padding: 4px 10px; border-radius: 6px; border: 1px solid #30363d; background: #161b22;
}
.nav-link-chip:hover { border-color: #60a5fa; color: #93c5fd; }

.page-switcher { display: flex; gap: 6px; flex-wrap: wrap; }
.page-switcher button {
  border: 1px solid #30363d; background: #161b22; color: #cbd5e1;
  padding: 4px 11px; border-radius: 6px; font-size: 12px; font-weight: 600;
}
.page-switcher button[aria-pressed="true"] { background: #2563eb; border-color: #2563eb; color: #fff; }

.stage { padding: 22px 24px 48px; display: flex; flex-direction: column; align-items: center; gap: 14px; overflow-x: auto; }
.concept-strip {
  width: min(1280px, 100%); font-size: 12px; color: #94a3b8;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.concept-strip strong { color: #e2e8f0; }

/* ===== Shared Design Tokens (Identical to App Zero-Base Concept) ===== */
.web-root {
  --canvas: #0b0f17;
  --header-bg: rgba(15, 21, 32, .88);
  --surface: #141c2a;
  --surface-2: #1b2537;
  --surface-hover: #212e45;
  --border: rgba(148, 163, 184, .16);
  --border-strong: rgba(148, 163, 184, .32);
  --text: #f1f5f9;
  --text-2: #94a3b8;
  --text-3: #94a3b8;
  --accent: #60a5fa;
  --accent-solid: #3b82f6;
  --accent-soft: rgba(96, 165, 250, .14);
  --on-accent: #ffffff;
  --up: #4ade80;
  --up-bg: rgba(74, 222, 128, .12);
  --danger: #fb7185;
  --danger-bg: rgba(251, 113, 133, .14);
  --danger-bd: rgba(251, 113, 133, .4);

  /* DDR WORLD Official Semantic Colors */
  --diff-bgn: #5fb8e8; --diff-bgn-bg: #23749c; --diff-bgn-fg: #ffffff;
  --diff-bas: #f3a621; --diff-bas-bg: #b97708; --diff-bas-fg: #ffffff;
  --diff-dif: #e64949; --diff-dif-bg: #b8333a; --diff-dif-fg: #ffffff;
  --diff-exp: #27a85a; --diff-exp-bg: #1f7d49; --diff-exp-fg: #ffffff;
  --diff-cha: #8c55c9; --diff-cha-bg: #6f42a6; --diff-cha-fg: #ffffff;

  --flare-classic: #d29067;
  --flare-white: #b9c9d1;
  --flare-gold: #ecbf2f;

  --b-gold-bg: #4c3911; --b-gold-bd: #e5b83f; --b-gold-fg: #ffe9a6;
  --b-yellow-bg: #3c4112; --b-yellow-bd: #e0e645; --b-yellow-fg: #f2f78a;
  --b-cyan-bg: #123e52; --b-cyan-bd: #46b9e9; --b-cyan-fg: #b8ecff;
  --b-green-bg: #153f2a; --b-green-bd: #4ad17a; --b-green-fg: #b9f5cd;
  --b-blue-bg: #173a68; --b-blue-bd: #65a8ff; --b-blue-fg: #c7e0ff;
  --b-orange-bg: #5e2405; --b-orange-bd: #ff8c24; --b-orange-fg: #ffe0b2;
  --b-purple-bg: #3b2a59; --b-purple-bd: #b48af5; --b-purple-fg: #e4d4ff;
  --b-bronze-bg: #36241e; --b-bronze-bd: #c98a68; --b-bronze-fg: #eed0be;
  --b-silver-bg: #273545; --b-silver-bd: #cbd5e1; --b-silver-fg: #f1f5f9;
  --b-red-bg: #541b22; --b-red-bd: #f26a78; --b-red-fg: #ffd1d5;
  --b-pink-bg: #531b3c; --b-pink-bd: #e06aae; --b-pink-fg: #ffd0e8;
  --b-slate-bg: #253246; --b-slate-bd: #66768a; --b-slate-fg: #d5dee9;
  --b-ex-bg: linear-gradient(90deg, #68252d 0%, #5a4310 25%, #153f2a 50%, #123e52 75%, #3b2a59 100%);
  --b-ex-bd: #c084fc; --b-ex-fg: #f0e9ff;

  --lamp-mfc: conic-gradient(#f87171, #facc15, #4ade80, #38bdf8, #c084fc, #f87171);
  --lamp-pfc: #facc15;
  --lamp-gfc: #4ade80;
  --lamp-fc: #60a5fa;
  --lamp-clear: #38bdf8;
  --lamp-failed: #fb7185;

  width: 1280px; min-height: 780px;
  background: var(--canvas); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: 14px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, .52);
  overflow: hidden; display: flex; flex-direction: column; position: relative;
}

.web-root.light {
  --canvas: #f5f7fa;
  --header-bg: rgba(255, 255, 255, .92);
  --surface: #ffffff;
  --surface-2: #eef2f6;
  --surface-hover: #e8eef5;
  --border: rgba(15, 23, 42, .10);
  --border-strong: rgba(15, 23, 42, .20);
  --text: #0f172a;
  --text-2: #475569;
  --text-3: #64748b;
  --accent: #2563eb;
  --accent-solid: #2563eb;
  --accent-soft: rgba(37, 99, 235, .10);
  --on-accent: #ffffff;
  --up: #15803d;
  --up-bg: rgba(21, 128, 61, .10);
  --danger: #be123c;
  --danger-bg: #fff1f2;
  --danger-bd: #fda4af;

  --diff-bgn-bg: #5fb8e8; --diff-bgn-fg: #0b2330;
  --diff-bas-bg: #f3a621; --diff-bas-fg: #2b1a00;
  --diff-dif-bg: #e64949; --diff-dif-fg: #ffffff;
  --diff-exp-bg: #27a85a; --diff-exp-fg: #ffffff;
  --diff-cha-bg: #8c55c9; --diff-cha-fg: #ffffff;

  --flare-classic: #c97c4e;
  --flare-white: #96b3c4;
  --flare-gold: #d9a31e;

  --b-gold-bg: #fef3c7; --b-gold-bd: #eab308; --b-gold-fg: #854d0e;
  --b-yellow-bg: #fef9a6; --b-yellow-bd: #ada21a; --b-yellow-fg: #524600;
  --b-cyan-bg: #e0f2fe; --b-cyan-bd: #38bdf8; --b-cyan-fg: #075985;
  --b-green-bg: #dcfce7; --b-green-bd: #22c55e; --b-green-fg: #166534;
  --b-blue-bg: #dbeafe; --b-blue-bd: #2563eb; --b-blue-fg: #1e3a8a;
  --b-orange-bg: #ffedd5; --b-orange-bd: #f97316; --b-orange-fg: #9a3412;
  --b-purple-bg: #ede9fe; --b-purple-bd: #8b5cf6; --b-purple-fg: #5b21b6;
  --b-bronze-bg: #f7ebe3; --b-bronze-bd: #c27849; --b-bronze-fg: #6b3719;
  --b-silver-bg: #e2e8f0; --b-silver-bd: #7c8fa8; --b-silver-fg: #334155;
  --b-red-bg: #fee2e2; --b-red-bd: #ef4444; --b-red-fg: #991b1b;
  --b-pink-bg: #fce7f3; --b-pink-bd: #f472b6; --b-pink-fg: #9d174d;
  --b-slate-bg: #f1f5f9; --b-slate-bd: #94a3b8; --b-slate-fg: #334155;
  --b-ex-bg: linear-gradient(90deg, #fecaca 0%, #fef3c7 25%, #dcfce7 50%, #e0f2fe 75%, #f3e8ff 100%);
  --b-ex-bd: #a855f7; --b-ex-fg: #0f172a;

  --lamp-pfc: #d97706;
  --lamp-gfc: #16a34a;
  --lamp-fc: #2563eb;
  --lamp-clear: #0284c7;
  --lamp-failed: #e11d48;
  box-shadow: 0 24px 60px rgba(15, 23, 42, .16);
}

.web-root.tablet { width: 768px; }
.web-root.mobile { width: 390px; }
.web-root :is(button, input, select, a, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ===== Site Header & Footer ===== */
.site-header {
  border-bottom: 1px solid var(--border);
  background: var(--header-bg); backdrop-filter: blur(12px);
}
.site-inner { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
.site-header .site-inner { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.site-brand {
  display: inline-flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--text); font-size: 17px; font-weight: 800; letter-spacing: -.03em; white-space: nowrap;
}
.site-footer { margin-top: auto; border-top: 1px solid var(--border); background: var(--surface); }
.site-footer .site-inner { min-height: 56px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-2); }

.web-shell { max-width: 1180px; width: 100%; margin: 0 auto; padding: 24px 24px 48px; }
.web-root.mobile .site-inner, .web-root.mobile .web-shell { padding-left: 16px; padding-right: 16px; }
.web-root.mobile .web-shell { padding-top: 18px; }

/* ===== Primitives ===== */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; min-width: 0; }
.web-root.mobile .card { padding: 14px 16px; }
.muted { color: var(--text-2); font-size: 12.5px; }
.label-xs { font-size: 11px; font-weight: 700; color: var(--text-2); letter-spacing: .04em; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 0 14px; border-radius: 8px; text-decoration: none;
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text);
  font-size: 13px; font-weight: 600; white-space: nowrap;
}
.btn:hover { background: var(--surface-hover); border-color: var(--accent); }
.btn.primary { background: var(--accent-solid); border-color: var(--accent-solid); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--danger-bg); border-color: var(--danger-bd); color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12px; }
.web-root.mobile .btn { min-height: 40px; }
.web-root.mobile .btn.sm { min-height: 34px; }

.seg {
  display: inline-flex; padding: 3px; border-radius: 9px;
  background: var(--surface-2); border: 1px solid var(--border); gap: 2px;
}
.seg button { border: 0; background: transparent; color: var(--text-2); padding: 5px 13px; border-radius: 6px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.22); }

.chip {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2);
  border-radius: 99px; padding: 4px 11px; font-size: 12px; font-weight: 600; white-space: nowrap;
}
.chip:hover { border-color: var(--accent); color: var(--text); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.input-field {
  width: 100%; min-height: 38px; padding: 7px 11px; border-radius: 8px;
  border: 1px solid var(--border-strong); background: var(--canvas); color: var(--text); font-size: 13px;
}

/* Info Popover (<details>) */
details.info-pop { display: inline-block; position: relative; }
details.info-pop summary {
  list-style: none; display: inline-flex; align-items: center; justify-content: center;
  width: 21px; height: 21px; border-radius: 50%; border: 1px solid var(--border-strong);
  background: var(--surface-2); color: var(--accent); font-size: 11.5px; font-weight: 800; cursor: pointer;
}
details.info-pop summary::-webkit-details-marker { display: none; }
details.info-pop[open] summary { background: var(--accent-solid); border-color: var(--accent-solid); color: #fff; }
.info-pop-body {
  position: absolute; top: 26px; left: 0; z-index: 30; width: min(320px, 80vw);
  background: var(--surface); color: var(--text); border: 1px solid var(--border-strong);
  border-radius: 10px; padding: 11px 13px; font-size: 12px; line-height: 1.6;
  box-shadow: 0 14px 32px rgba(0,0,0,.35);
}
.web-root.mobile .info-pop-body { left: -110px; width: 280px; }

/* ===== DDR Official Semantic Visuals (Identical to App) ===== */
.diff-pill { display: inline-flex; align-items: center; justify-content: center; padding: 2px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 800; line-height: 1.3; white-space: nowrap; }
.diff-bgn { background: var(--diff-bgn-bg); color: var(--diff-bgn-fg); }
.diff-bas { background: var(--diff-bas-bg); color: var(--diff-bas-fg); }
.diff-dif { background: var(--diff-dif-bg); color: var(--diff-dif-fg); }
.diff-exp { background: var(--diff-exp-bg); color: var(--diff-exp-fg); }
.diff-cha { background: var(--diff-cha-bg); color: var(--diff-cha-fg); }
.diff-bar { width: 4px; border-radius: 99px; flex-shrink: 0; align-self: stretch; }
.diff-bar.bgn { background: var(--diff-bgn); }
.diff-bar.bas { background: var(--diff-bas); }
.diff-bar.dif { background: var(--diff-dif); }
.diff-bar.exp { background: var(--diff-exp); }
.diff-bar.cha { background: var(--diff-cha); }

.rank-inline { font-weight: 900; letter-spacing: -.03em; line-height: 1; }
.rank-upper { color: #facc15; }
.rank-b { color: #46b9e9; }
.rank-c { color: #f472b6; }
.rank-d { color: #f26a78; }
.rank-e { color: #94a3b8; }
.web-root.light .rank-upper { color: #a16207; }
.web-root.light .rank-b { color: #0369a1; }
.web-root.light .rank-c { color: #be185d; }
.web-root.light .rank-d { color: #b91c1c; }
.web-root.light .rank-e { color: #475569; }

.clear-lamp {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; min-height: 22px; border-radius: 99px;
  background: var(--surface-2); border: 1px solid var(--border-strong); font-size: 11px; font-weight: 800; color: var(--text); white-space: nowrap;
}
.lamp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.lamp-mfc { background: var(--lamp-mfc); box-shadow: 0 0 6px rgba(192,132,252,.7); }
.lamp-pfc { background: var(--lamp-pfc); box-shadow: 0 0 6px rgba(250,204,21,.6); }
.lamp-gfc { background: var(--lamp-gfc); box-shadow: 0 0 6px rgba(74,222,128,.55); }
.lamp-fc { background: var(--lamp-fc); }
.lamp-clear { background: var(--lamp-clear); }
.lamp-failed { background: var(--lamp-failed); }

.badge {
  display: inline-flex; align-items: center; justify-content: center; padding: 2px 8px; min-height: 22px; border-radius: 5px;
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font-size: 10.5px; font-weight: 800; white-space: nowrap;
}
.badge.gold { background: var(--b-gold-bg); border-color: var(--b-gold-bd); color: var(--b-gold-fg); }
.badge.yellow { background: var(--b-yellow-bg); border-color: var(--b-yellow-bd); color: var(--b-yellow-fg); }
.badge.cyan { background: var(--b-cyan-bg); border-color: var(--b-cyan-bd); color: var(--b-cyan-fg); }
.badge.green { background: var(--b-green-bg); border-color: var(--b-green-bd); color: var(--b-green-fg); }
.badge.blue { background: var(--b-blue-bg); border-color: var(--b-blue-bd); color: var(--b-blue-fg); }
.badge.orange { background: var(--b-orange-bg); border-color: var(--b-orange-bd); color: var(--b-orange-fg); }
.badge.purple { background: var(--b-purple-bg); border-color: var(--b-purple-bd); color: var(--b-purple-fg); }
.badge.bronze { background: var(--b-bronze-bg); border-color: var(--b-bronze-bd); color: var(--b-bronze-fg); }
.badge.silver { background: var(--b-silver-bg); border-color: var(--b-silver-bd); color: var(--b-silver-fg); }
.badge.red { background: var(--b-red-bg); border-color: var(--b-red-bd); color: var(--b-red-fg); }
.badge.pink { background: var(--b-pink-bg); border-color: var(--b-pink-bd); color: var(--b-pink-fg); }
.badge.slate { background: var(--b-slate-bg); border-color: var(--b-slate-bd); color: var(--b-slate-fg); }
.badge.ex { background: var(--b-ex-bg); border-color: var(--b-ex-bd); color: var(--b-ex-fg); }

/* ===== 1. Zero-Base Landing Page ===== */
.lp-hero-grid {
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: center;
  background: radial-gradient(circle at 6% 10%, rgba(59, 130, 246, .14), transparent 46%), var(--surface);
  padding: 28px;
}
.web-root.tablet .lp-hero-grid, .web-root.mobile .lp-hero-grid { grid-template-columns: 1fr; padding: 20px; gap: 18px; }

.lp-preview-box {
  background: var(--canvas); border: 1px solid var(--border-strong); border-radius: 12px;
  padding: 14px 16px; display: grid; gap: 10px;
}
.lp-mini-row {
  display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border);
}

.lp-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.lp-compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.web-root.mobile .lp-steps, .web-root.mobile .lp-compare, .web-root.tablet .lp-compare { grid-template-columns: 1fr; }

.step-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px;
  display: grid; gap: 6px; align-content: start;
}
.step-index { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: .06em; }
.scope-list { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.scope-list li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.scope-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 8px; flex-shrink: 0; background: var(--accent); }

/* ===== 2. Zero-Base Public Player Dossier ===== */
.dossier-banner {
  background: radial-gradient(circle at 88% 20%, rgba(106, 220, 213, .16), transparent 46%), var(--surface);
  border: 1px solid var(--border); border-radius: 14px; padding: 18px 22px;
  display: grid; grid-template-columns: minmax(0, 1.15fr) auto; gap: 20px; align-items: center;
}
.web-root.tablet .dossier-banner, .web-root.mobile .dossier-banner { grid-template-columns: 1fr; padding: 16px; gap: 14px; }

.dossier-name { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; overflow-wrap: anywhere; }
.web-root.mobile .dossier-name { font-size: 22px; }

.dossier-kpis {
  display: flex; align-items: stretch; gap: 12px; flex-wrap: wrap;
}
.kpi-chip-card {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 14px; min-width: 130px; display: flex; flex-direction: column; justify-content: center;
}
.web-root.mobile .kpi-chip-card { flex: 1 1 130px; min-width: 0; }

.flare-rank-inline {
  font-size: 22px; font-weight: 900; line-height: 1.05; letter-spacing: -.03em;
  background: linear-gradient(180deg, #cefff9 0%, #6adcd5 55%, #41cdae 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
}
.web-root.light .flare-rank-inline {
  background: linear-gradient(180deg, #0d9488 0%, #0f766e 55%, #115e59 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
}
.flare-rank-big {

function getRows() {
  const src = state.stress === 'stress' ? LONG_TITLES : NORMAL_TITLES;

    ...r,
    level: state.railMode === 'level' ? state.level : r.level,
    song: src[i % src.length][0],
    artist: src[i % src.length][1],
    version: src[i % src.length][2],
  }));
  if (state.railMode === 'title' && state.query.trim()) {
    const q = state.query.trim().toLowerCase();
    rows = rows.filter(r => r.song.toLowerCase().includes(q) || r.artist.toLowerCase().includes(q));
  }
  if (state.quickFilter === 'aaa') rows = rows.filter(r => r.rank === 'AAA');
  if (state.quickFilter === 'fc') rows = rows.filter(r => ['MFC', 'PFC', 'GFC', 'FC'].includes(r.clear));
  if (state.quickFilter === 'flare9') rows = rows.filter(r => ['IX', 'EX'].includes(r.flare));

  if (state.sort === 'score-desc') rows.sort((a, b) => b.score - a.score);
  else if (state.sort === 'score-asc') rows.sort((a, b) => a.score - b.score);
  else if (state.sort === 'ex-desc') rows.sort((a, b) => b.ex - a.ex);
  else if (state.sort === 'title-asc') rows.sort((a, b) => a.song.localeCompare(b.song, 'ja'));

                  <div style="display:flex;gap:5px;align-items:center;margin-top:2px">
                    <span class="diff-pill diff-${it.key}" style="font-size:10px;padding:1px 5px">${it.short}</span>
                    <span class="muted num" style="font-size:11px">Lv.${it.lv}</span>

                </div>
                <div style="text-align:right;flex-shrink:0">
                  ${renderFlareBadge(it.flare, true)}

              </div>`).join('')}
            <div class="flare-panel-footer">
              <span>上位 ${c.items.length} / 30 譜面</span>

            </div>
          </article>`).join('')}
      </div>`;
  }

  return renderWebShell(`
    <main class="web-shell">
      <section class="dossier-banner">
        <div style="min-width:0;display:grid;gap:8px">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <h1 class="dossier-name">${state.stress === 'stress' ? 'DDR_PLAYER_LONG_DISPLAY_NAME_2026' : 'PLAYER_DDR'}</h1>
            <div class="seg">
              <button data-wstyle="SP" aria-pressed="${state.style === 'SP'}">SINGLE</button>
              <button data-wstyle="DP" aria-pressed="${state.style === 'DP'}">DOUBLE</button>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <span class="muted">最終更新：2026/11/28 14:26</span>
            <button class="btn sm" data-act="copy-url">URLをコピー</button>
            <button class="btn sm" data-act="open-legend">色の見方</button>
          </div>
        </div>

        <div class="dossier-kpis">
          <div class="kpi-chip-card" style="min-width:210px">
            <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
              <span class="flare-rank-inline">${st.rank} ${st.sub}</span>
              <strong class="num" style="font-size:18px">${fmt(st.total)}</strong>
            </div>
            <div class="cat-mini-bar" title="CLASSIC / WHITE / GOLD 比率">
              <span style="width:${Math.round(st.classic / catSum * 100)}%;background:var(--flare-classic)"></span>
              <span style="width:${Math.round(st.white / catSum * 100)}%;background:var(--flare-white)"></span>
              <span style="width:${Math.round(st.gold / catSum * 100)}%;background:var(--flare-gold)"></span>
            </div>
            <div class="muted num" style="font-size:10.5px;margin-top:4px;display:flex;justify-content:space-between;gap:6px">
              <span>C ${fmt(st.classic)}</span><span>W ${fmt(st.white)}</span><span>G ${fmt(st.gold)}</span>
            </div>
          </div>
          <div class="kpi-chip-card">
            <span class="label-xs">公開譜面</span>
            <strong class="num" style="font-size:20px;line-height:1.2;margin-top:2px">${st.recordedCharts}</strong>
            <span class="muted num" style="font-size:11px">AAA ${st.aaaCount} · FC+ ${st.fcCount}</span>
          </div>
        </div>
      </section>

      <div class="dossier-toolbar">
        <div class="mode-tabs" role="tablist">
          <button class="mode-tab" data-pview="best" aria-pressed="${state.playerView === 'best'}">自己ベスト</button>
          <button class="mode-tab" data-pview="flare" aria-pressed="${state.playerView === 'flare'}">フレアスキル</button>
        </div>
        <span class="muted" style="font-size:12px">${state.playerView === 'best' ? '左のレベル進捗から譜面を切り替えられます' : 'カテゴリ別上位30譜面の内訳を表示しています'}</span>
      </div>

      ${workspaceHtml}
    </main>
  `);
}

function renderSwitcher() {
  const pages = [['home','トップ'],['player','公開ページ'],['profile','マイページ'],['connect','アプリ連携確認']];
  document.getElementById('page-switcher').innerHTML = pages.map(([id, l]) =>
    `<button data-page="${id}" aria-pressed="${state.page === id}">${l}</button>`).join('');
}

function render() {
  renderSwitcher();
  document.getElementById('w-stress').value = state.stress;
  document.getElementById('w-theme').value = state.theme;
  document.getElementById('w-size').value = state.size;
  const views = { home: viewLanding, player: viewPlayer, profile: viewProfile, connect: viewConnect };
  document.getElementById('mount').innerHTML = (views[state.page] || viewPlayer)();

  const q = document.getElementById('w-q-input');
  if (q) q.addEventListener('input', e => {
    state.query = e.target.value; render();
    const el = document.getElementById('w-q-input');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  });
  const mlv = document.getElementById('m-lv-sel');
  if (mlv) mlv.addEventListener('change', e => { state.level = Number(e.target.value); render(); });
  const srt = document.getElementById('w-sort');
  if (srt) srt.addEventListener('change', e => { state.sort = e.target.value; render(); });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-page],[data-pview],[data-wstyle],[data-rail],[data-wlv],[data-wver],[data-qf],[data-expand-row],[data-fcat],[data-act]');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.dataset.page) { state.page = el.dataset.page; state.showLegend = false; render(); return; }
  if (el.dataset.pview) { state.playerView = el.dataset.pview; render(); return; }
  if (el.dataset.wstyle) {
    state.style = el.dataset.wstyle;
    const avail = STYLE_DATA[state.style].levels;
    if (!avail.some(x => x.lv === state.level)) state.level = avail[0].lv;
    state.expandedRowId = null;
    render(); return;
  }
  if (el.dataset.rail) { state.railMode = el.dataset.rail; render(); return; }
  if (el.dataset.wlv) { state.level = Number(el.dataset.wlv); state.expandedRowId = null; render(); return; }
  if (el.dataset.wver) { state.version = el.dataset.wver; state.expandedRowId = null; render(); return; }
  if (el.dataset.qf) { state.quickFilter = el.dataset.qf; render(); return; }
  if (el.dataset.expandRow) { state.expandedRowId = state.expandedRowId === el.dataset.expandRow ? null : el.dataset.expandRow; render(); return; }
  if (el.dataset.fcat) { state.flareCatMobile = el.dataset.fcat; render(); return; }

  const a = el.dataset.act;
  if (a === 'open-legend') { state.showLegend = true; render(); }
  else if (a === 'close-legend' && (!el.classList.contains('modal-backdrop') || e.target === el)) { state.showLegend = false; render(); }
  else if (a === 'toggle-flare-more') { state.flareExpanded = !state.flareExpanded; render(); }
  else if (a === 'copy-url') toast('公開URLをコピーしました');
  else if (a === 'save-name') toast('公開プレーヤー名を保存しました');
  else if (a === 'dl') toast('GitHub Releases の最新セットアップへ移動します');
  else if (a === 'guide') toast('利用ガイド（GitHub）を開きます');
  else if (a === 'repo') toast('GitHub リポジトリを開きます');
  else if (a === 'approve') toast('アプリ側の連携完了を確認してください');
  else if (a === 'danger-demo') toast('再認証と確認画面を経て安全に実行されます');
});

document.getElementById('w-stress').addEventListener('change', e => { state.stress = e.target.value; render(); });
document.getElementById('w-theme').addEventListener('change', e => { state.theme = e.target.value; render(); });
document.getElementById('w-size').addEventListener('change', e => { state.size = e.target.value; render(); });

render();
</script>
